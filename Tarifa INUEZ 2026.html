<style>

:root[data-theme="dark"]{--bg:#10181a;--card:#182326;--ink:#e6eeee;--mut:#93a5a8;--line:#2c3c40;--acc:#4fc3c7;--accT:#07191a;--inp:#2d2a12;--ok:#5ed08a;--warn:#f0b04d}

h1{font-size:22px;font-weight:800;margin:14px 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:10px}
nav{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}

select{width:auto;max-width:190px}b.v{font-weight:800}.imp{width:78px;text-align:right}

svg.pl{width:100%;height:auto;display:block;margin:6px 0;max-height:360px}svg.pl text{fill:var(--ink);stroke:none;font-family:inherit}svg.pl rect{vector-effect:non-scaling-stroke;stroke:var(--ink);stroke-width:1}.th,.tp{fill:var(--acc);fill-opacity:.45}.tc{fill:var(--warn);fill-opacity:.6}
.seg{display:flex;gap:6px;margin:6px 0}.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:5px 16px;font:600 13px Archivo,system-ui,sans-serif}.seg button.on{background:var(--acc);color:var(--accT);border-color:var(--acc)}svg.pl polygon{stroke:var(--ink);stroke-width:.8;vector-effect:non-scaling-stroke}.tb{fill:var(--line);fill-opacity:.55}

</style></head><body>
<h1>Tarifa INUEZ 2026</h1><div class="sub">Rellena las casillas amarillas. Todo se calcula al momento.</div>
<nav id="nav"></nav><div id="app"></div>
<script>
const r6=x=>Math.round(x*1e6)/1e6,r2=x=>Math.round(x*100)/100,r4=x=>Math.round(x*1e4)/1e4;
const eur=x=>x.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const num=v=>{v=parseFloat(String(v).replace(',','.'));return isNaN(v)?0:v};
const sz=[[30,45,60,90,120,150,180]];
const two=(a,b,sizes,pa,pb,u='cm')=>sizes.flatMap((s,i)=>[[a,s+' '+u,pa[i]],[b,s+' '+u,pb[i]]]);
const S=[
{id:'cortes',n:'Cortes',tit:'Cortes',rows:[['Corte recto','1 metro lineal',3],['Inglete','1 metro lineal',4],['Corte recto (gran formato)','1 metro lineal',15],['Inglete (gran formato)','1 metro lineal',20]],q:{0:1.2},p:{BL:120,BW:60,pl:60,pw:30,N:15}},
{id:'rodapies',n:'Rodapiés',tit:'Rodapiés',rows:two('Cortado y biselado','Canto romo',[33,45,60,90,120,150,180],[1,1.4,1.8,2.25,2.8,3.55,4.5],[1.3,1.45,2.05,2.55,3.05,3.95,5.1]),q:{5:100},p:{BL:60,BW:60,pl:60,pw:8,N:100}},
{id:'peldanos',n:'Peldaños',tit:'Peldaños canto romo y romo y ranurado',rows:two('Peldaño romo','Peldaño romo y ranurado',[30,45,60,90,120,150,180],[1.7,1.95,2.7,3.2,4,4.8,6.2],[4,6.15,7.95,9.75,11.55,13.35,15.15]),q:{},p:{BL:120,BW:60,pl:60,pw:30,N:0}},
{id:'tecnico',n:'Peldaño técnico',tit:'Peldaño técnico',tec:1,rows:[['Sin encolar','Centímetro lineal',.35],['Encolado','Centímetro lineal',.4],['Con contrahuella sin encolar','Centímetro lineal',.5],['Con contrahuella encolado','Centímetro lineal',.6],['Ranuras antideslizantes (3 ranuras)','Precio por pieza',5]],q:{},p:{BL:120,BW:60,sl:120,hf:26.55,ch:3,N:2,opt:'metros'}},
{id:'encimeras',n:'Encimeras',tit:'Encimeras simples de baño y de cocina',rows:[['Encolada','Centímetro lineal',.7],['Orificios','Grifería y desagüe',10],['Orificios especiales','Para lavabos y fregaderos',50]],q:{},p:{BL:120,BW:60,pl:40,pw:60,N:0}},
{id:'otros',n:'Otros trabajos',tit:'Otros trabajos',rows:[['Peldaño pegado','36 cm',5.5],['Escuadra pegada','36 cm',11],['Peldaño pegado','52 cm',7.5],['Escuadra pegada','52 cm',15]],q:{},p:{BL:120,BW:60,pl:52,pw:36,N:0}},
{id:'espec',n:'Especificaciones',tit:'Especificaciones de nuestra tarifa',txt:1}];
S.forEach(s=>{s.k=0.3;s.rec=0.39});
const ESP=['Debido a la naturaleza de nuestro trabajo no se admitirán devoluciones.','Los precios son hasta dicha medida: de 0 a 33 cm, de 33 a 45, de 45 a 60, de 60 a 90 y de 90 a 120 cm. Cuando el pavimento sobrepasa una medida se cobra como la siguiente.','La altura mínima para hacer un rodapié canto romo es 7 cm.','Si un rodapié romo pasa de 15 cm de altura, se considera peldaño romo y se cobra como tal.','Si al realizar un rodapié o un peldaño hay que modificar la medida original del pavimento, se cobra el corte adicional en metros lineales.','Un peldaño romo nunca podrá exceder los 60 cm de fondo: es la medida máxima de nuestra maquinaria para estos trabajos.','Al realizar un corte en cualquier pavimento se pierden 0,3 cm de cerámica por el grosor de los discos.','En trabajos de gran formato hay que dejar y recoger el material en nuestro almacén, porque los cajones para transportarlos no caben en nuestros furgones.'];

/* ---- cálculo genérico (hojas de piezas y cortes) ---- */
const nIn=(B,l,k)=>(l<=0||l>B)?0:Math.floor(r6((B+k)/(l+k)));
const cutN=(B,n,l,k)=>n==0?0:(r2(B-n*l-(n-1)*k)>0?n:n-1);
function remM(o,p,r){const{nL,nW,cL,cW,l,w}=o;
 let A=0,rem=r;const nc=Math.ceil(r/nW);A+=Math.min(nc,cL)*p.BW;for(let i=0;i<nc;i++){const q=Math.min(nW,rem);rem-=q;A+=Math.min(q,cW)*l}
 let B=0;rem=r;const nr=Math.ceil(r/nL);B+=Math.min(nr,cW)*p.BL;for(let i=0;i<nr;i++){const q=Math.min(nL,rem);rem-=q;B+=Math.min(q,cL)*w}
 return Math.min(A,B)/100}
function gen(p,k){
 const O=[[p.pl,p.pw],[p.pw,p.pl]].map(([l,w])=>{const nL=nIn(p.BL,l,k),nW=nIn(p.BW,w,k),cL=cutN(p.BL,nL,l,0),cW=cutN(p.BW,nW,w,0),pcs=nL*nW;
  const x=pcs?gcut(p.BL,p.BW,nL,nW,l,w,k):{c:0,m:0};
  return pcs?{pcs,c:x.c,m:x.m,cuts:x.cuts,l,w,nL,nW,cL,cW}:{pcs:0,c:0,m:0}});
 const first=O[0].pcs>O[1].pcs||(O[0].pcs==O[1].pcs&&O[0].m<=O[1].m);const o=first?O[0]:O[1];
 const t=p.N>0&&o.pcs>0?Math.ceil(p.N/o.pcs):null;
 return{o,pcs:o.pcs,c:o.c,m:o.m,col:o.pcs?(first?'Tal cual':'Girada 90°'):'No cabe',t,sob:t?t*o.pcs-p.N:null,mt:t?Math.floor(p.N/o.pcs)*o.m+(p.N%o.pcs>0?part(p.BL,p.BW,o.nL,o.nW,o.l,o.w,k,0,0,p.N%o.pcs):0):null,pr:(t&&p.N%o.pcs>0)?partO(p.BL,p.BW,o.nL,o.nW,o.l,o.w,k,0,0,p.N%o.pcs):null}}

/* corte de lado a lado: recorta sobrantes y divide, siempre sobre la pieza que queda; elige el orden con menos metros */
function gcut(L,W,nx,ny,p,q,k,ep,eq){ep=ep||p;eq=eq||q;const rx=r2(L-nx*ep-(nx-1)*k)>0,ry=r2(W-ny*eq-(ny-1)*k)>0;let b=null;
 for(const o of[0,1])for(const s of[0,1]){let m=0,c=0,l=L,w=W;
  const cu=[],tx=()=>{if(rx){cu.push({l:w,n:1,t:'sobrante'});m+=w;c++;l=nx*p}},ty=()=>{if(ry){cu.push({l:l,n:1,t:'sobrante'});m+=l;c++;w=ny*q}};
  o?(ty(),tx()):(tx(),ty());
  if(s){if(nx>1)cu.push({l:w,n:nx-1,t:'división'});if(ny>1)cu.push({l:p,n:nx*(ny-1),t:'división'});m+=(nx-1)*w+nx*(ny-1)*p;c+=nx-1+nx*(ny-1)}else{if(ny>1)cu.push({l:l,n:ny-1,t:'división'});if(nx>1)cu.push({l:q,n:ny*(nx-1),t:'división'});m+=(ny-1)*l+ny*(nx-1)*q;c+=ny-1+ny*(nx-1)}
  if(!b||r6(m/100)<r6(b.m)||(r6(m/100)==r6(b.m)&&c<b.c))b={c,m:m/100,cuts:cu}}
 return b}
/* última baldosa con menos piezas que una completa: mejor corte posible para r piezas */
function partO(L,W,nx,ny,p,q,k,ep,eq,r){let b=null;for(let a=1;a<=nx;a++)for(let c=1;c<=ny;c++)if(a*c>=r){const g=gcut(L,W,a,c,p,q,k,ep,eq);if(!b||r6(g.m)<r6(b.m))b={...g,gx:a,gy:c,r}}return b||{m:0,c:0,cuts:[],gx:0,gy:0,r}}
function part(...a){return partO(...a).m}
/* ---- peldaño técnico ---- */
function tec(p,k){
 const c2=p.ch>0?2:1,N=p.N;
 const O=[[p.sl,1,p.hf+p.ch,c2],[p.hf+p.ch,c2,p.sl,1]].map(([P5,P6,P7,P8])=>{
  const P9=P5+(P6==2?k:0),P10=P7+(P8==2?k:0),n11=nIn(p.BL,P9,k),n12=nIn(p.BW,P10,k),st=n11*n12;
  const g=st?gcut(p.BL,p.BW,n11,n12,P5,P7,k,P9,P10):{c:0,m:0};
  
  return{st,c:g.c,m:g.m,cuts:g.cuts,n11,n12,P9,P10}});
 const f1=O[0].st>O[1].st||(O[0].st==O[1].st&&O[0].m<=O[1].m),o=f1?O[0]:O[1],spo=o.st;
 const sep=p.ch>0;const base={f1,o,spo,pcs:spo*c2,c:o.c,m:r4(o.m),col:spo?(f1?'Tal cual':'Girado 90°'):'No cabe'};
 base.t=N>0?(spo?Math.ceil(N/spo):null):null;base.sob=base.t?base.t*spo-N:null;base.mt=base.t?Math.floor(N/spo)*base.m+(N%spo>0?part(p.BL,p.BW,o.n11,o.n12,f1?p.sl:p.hf+p.ch,f1?p.hf+p.ch:p.sl,k,o.P9,o.P10,N%spo):0):null;base.cuts=o.cuts;base.pr=(base.t&&N%spo>0)?partO(p.BL,p.BW,o.n11,o.n12,f1?p.sl:p.hf+p.ch,f1?p.hf+p.ch:p.sl,k,o.P9,o.P10,N%spo):null;base.mp=N*p.sl/100;
 base.tn=base.t||9999;
 /* optimización */
 const R=[[p.BL,p.BW],[p.BW,p.BL]].map(([L,W])=>{
  const n=(p.sl>0&&p.sl<=L)?nIn(L,p.sl,k):0,ca=n?n-(r2(L-n*p.sl)>0?0:1):0,amax=(p.hf>0&&p.hf<=W)?Math.min(10,nIn(W,p.hf,k)):0,bf=(p.ch>0&&p.ch<=W)?nIn(W,p.ch,k):0;
  const rows=[];for(let a=1;a<=10;a++){
   const v=N>0&&p.ch>0&&n>0&&a<=amax&&bf>0;if(!v){rows.push({T:9999,v:0});continue}
   const hh=p.hf+k,b=Math.max(0,Math.floor(r6((W+k-a*hh)/(p.ch+k)))),F=Math.floor(r6(N/(a*n))),Rm=N-F*a*n,ar=Rm>0?Math.ceil(Rm/n):0,
    br=ar>0?Math.max(0,Math.floor(r6((W+k-ar*hh)/(p.ch+k)))):0,con=n*(F*b+br),ex=N>con?Math.ceil((N-con)/(n*bf)):0,T=F+(Rm>0?1:0)+ex,
    X=Math.ceil(N/n),Y=Math.min(F*b,X),Z=Rm>0?Math.min(br,X-Y):0,AA=Math.max(0,X-Y-Z);
   const AB=(F*a+Y-((Y==F*b&&r2(W-(a*p.hf+b*p.ch))<=0)?F:0))+(Rm>0?(ar+Z-((Z==br&&r2(W-(ar*p.hf+br*p.ch))<=0)?1:0)):0)+(AA-((bf>0&&r2(W-bf*p.ch)<=0)?Math.floor(AA/Math.max(1,bf)):0));
   const m=Math.max(0,r4((AB*n*p.sl+ca*X*(p.hf+p.ch))/100-N*p.sl/100));
   rows.push({v:1,a,b,F,Rm,ar,br,ex,T,m,n,Hs:F*a*n+ar*n,Cs:ex>0?N:con})}
  return rows});
 const P=f1?o.n12:o.n11,idx=P>=1&&P<=10?R[f1?0:1][P-1]:null;
 const real=idx&&idx.v?idx.m:9999,Lm=(base.t&&spo)?Math.min(base.t*base.m,real):9999;
 const sc=r=>r.v?(p.opt=='metros'?(r.T<=base.tn?r.m+r.T/1e6:99999):r.T+r.m/1e5):99999;
 const best=R.map(rs=>rs.reduce((b,r)=>sc(r)<sc(b)?r:b,{v:0}));
 const w=sc(best[0])<=sc(best[1])?0:1,bb=best[w];base.Lm=Lm;
 if(p.opt!='no'&&bb.v&&bb.T<9999){
  const ap=p.opt=='metros'?(r4(bb.m)<r4(Lm)||(r4(bb.m)==r4(Lm)&&bb.T<base.tn)):(bb.T<base.tn||(bb.T==base.tn&&r4(bb.m)<r4(Lm)));
  base.opt={w,bb,ori:w==0?'Tal cual':'Girado 90°',ap};
  if(ap){base.t=bb.T;base.sob=Math.min(bb.Hs,bb.Cs)-N;base.mt=bb.m}}
 
 return base}

/* ---- planos ---- */
const fmt=n=>String(+(+n).toFixed(2)).replace('.',',');
function tile(L,W,rs){return V3?tile3(L,W,rs):tile2(L,W,rs)}
function tile2(L,W,rs){const f=Math.max(L,W)/24,m=f*2.6,lab=r=>r.w>f*5.2&&r.h>f*1.5?`<text x="${r.x+r.w/2}" y="${r.y+r.h/2}" font-size="${f}" text-anchor="middle" dominant-baseline="central">${fmt(r.w)}×${fmt(r.h)}</text>`:'';
 return `<svg class="pl" viewBox="${-m} ${-m} ${L+m*1.3} ${W+m*1.3}"><rect x="0" y="0" width="${L}" height="${W}" fill="none"/>`+rs.map(r=>`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" class="${r.c}"/>`+lab(r)).join('')+`<text x="${L/2}" y="${-f*0.7}" font-size="${f*1.1}" font-weight="700" text-anchor="middle">${fmt(L)} cm</text><text transform="translate(${-f*0.7} ${W/2}) rotate(-90)" font-size="${f*1.1}" font-weight="700" text-anchor="middle">${fmt(W)} cm</text></svg>`}
function planGen(d,p,k,nx,ny,rr){if(!d.pcs)return '';const o=d.o,r=[];let n=0;for(let i=0;i<(nx||o.nL);i++)for(let j=0;j<(ny||o.nW);j++)r.push({x:i*(o.l+k),y:j*(o.w+k),w:o.l,h:o.w,c:(!rr||n++<rr)?'tp':'tb'});return tile(p.BL,p.BW,r)}
function planTec(d,p,k,nx,ny){const r=[];
 if(d.opt&&d.opt.ap){const b=d.opt.bb,w=d.opt.w,L=w?p.BW:p.BL,W=w?p.BL:p.BW;let y=0;for(let a=0;a<b.a+b.b;a++){const hu=a<b.a,h=hu?p.hf:p.ch;for(let i=0;i<b.n;i++)r.push({x:i*(p.sl+k),y,w:p.sl,h,c:hu?'th':'tc'});y+=h+k}return tile(L,W,r)}
 if(!d.spo)return '';const o=d.o,sep=p.ch>0;
 for(let i=0;i<(nx||o.n11);i++)for(let j=0;j<(ny||o.n12);j++){const x=i*(o.P9+k),y=j*(o.P10+k);
  if(d.f1){r.push({x,y,w:p.sl,h:p.hf,c:'th'});if(sep)r.push({x,y:y+p.hf+k,w:p.sl,h:p.ch,c:'tc'})}
  else{r.push({x,y,w:p.hf,h:p.sl,c:'th'});if(sep)r.push({x:x+p.hf+k,y,w:p.ch,h:p.sl,c:'tc'})}}
 return tile(p.BL,p.BW,r)}
let V3=false;const seg=()=>`<div class="seg"><button data-v="2"${V3?'':' class="on"'}>2D</button><button data-v="3"${V3?' class="on"':''}>3D</button></div>`;
function tile3(L,W,rs){const t=Math.max(Math.min(L,W)/14,1.5),P=(x,y,z)=>[(x-y)*.866,(x+y)*.5-z],pt=a=>a.map(q=>P(...q).map(v=>+v.toFixed(2)).join(',')).join(' ');
 const bw=(L+W)*.866,f=bw/24,x0=-W*.866-f*2,y0=-t-f*2,vw=bw+f*4,vh=(L+W)*.5+t+f*6;
 const box=(x,y,w,h,c)=>{const s=[[[x,y+h,0],[x+w,y+h,0],[x+w,y+h,t],[x,y+h,t]],[[x+w,y,0],[x+w,y+h,0],[x+w,y+h,t],[x+w,y,t]]];
  return s.map(a=>`<polygon points="${pt(a)}" class="${c}"/><polygon points="${pt(a)}" fill="var(--ink)" fill-opacity=".25"/>`).join('')+`<polygon points="${pt([[x,y,t],[x+w,y,t],[x+w,y+h,t],[x,y+h,t]])}" class="${c}"/>`};
 const a=P(L/2,W,0),b=P(L,W/2,0);
 return `<svg class="pl" viewBox="${x0} ${y0} ${vw} ${vh}">`+box(0,0,L,W,'tb')+rs.slice().sort((p,q)=>(p.x+p.y)-(q.x+q.y)).map(r=>box(r.x,r.y,r.w,r.h,r.c)).join('')+`<text transform="translate(${a[0]} ${a[1]+f*2}) rotate(30)" font-size="${f*1.1}" font-weight="700" text-anchor="middle">${fmt(L)} cm</text><text transform="translate(${b[0]} ${b[1]+f*2}) rotate(-30)" font-size="${f*1.1}" font-weight="700" text-anchor="middle">${fmt(W)} cm</text></svg>`}
/* ---- interfaz ---- */
let cur=0;const nav=document.getElementById('nav'),app=document.getElementById('app');
S.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.n;b.onclick=()=>{cur=i;draw()};nav.appendChild(b)});
const fld=(lab,key,sub)=>`<div class="r"><span>${lab}${sub?`<small>${sub}</small>`:''}</span><input inputmode="decimal" data-k="${key}" value="${S[cur].p[key]||''}"></div>`;
function draw(){
 [...nav.children].forEach((b,i)=>b.className=i==cur?'on':'');const s=S[cur];let h='';
 if(s.txt){app.innerHTML=`<div class="card"><h2>${s.tit}</h2><ul>${ESP.map(t=>`<li>${t}</li>`).join('')}</ul><p class="note">Para otro tipo de trabajos, consultar precios.<br>Diego: <a href="tel:664044629">664044629</a> · <a href="mailto:inuezsl@gmail.com">inuezsl@gmail.com</a></p></div>`;return}
 h+=`<div class="card"><h2>${s.tit}: tarifa</h2>`;
 s.rows.forEach((r,i)=>{h+=`<div class="r"><span>${r[0]}<small>${r[1]} · ${eur(r[2])}</small></span><input inputmode="decimal" data-q="${i}" value="${s.q[i]||''}" placeholder="0"><b class="v imp" id="i${i}"></b></div>`});
 h+=`<div class="tot"><span>TOTAL</span><span id="t0"></span></div><div class="r"><span>Recargo <input style="width:60px" inputmode="decimal" data-rec value="${s.rec*100}"> %</span><b class="v" id="t1"></b></div></div>`;
 if(s.rows[0]&&!s.txt){const p=s.p;h+=`<div class="card"><h2>Calculadora de ${s.tec?'peldaños técnicos':'piezas y cortes'}</h2>`+fld('Baldosa: largo (cm)','BL')+fld('Baldosa: ancho (cm)','BW');
  h+=s.tec?fld('Peldaño: largo (cm)','sl')+fld('Fondo de la huella (cm)','hf')+fld('Contrahuella: alto (cm)','ch','0 = sin contrahuella'):fld('Pieza deseada: largo (cm)','pl')+fld('Pieza deseada: ancho (cm)','pw');
  h+=fld(s.tec?'Peldaños que necesito':'Piezas que necesito','N')+`<div class="r"><span>Grosor del disco (cm)</span><input inputmode="decimal" data-kerf value="${s.k}"></div>`;
  if(s.tec)h+=`<div class="r"><span>Optimizar piezas</span><select data-opt>${[['no','No'],['baldosas','Menos baldosas'],['metros','Menos metros']].map(o=>`<option value="${o[0]}"${p.opt==o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></div>`;
  h+=`<div class="sec">Resultado</div><div id="res"></div></div>`}
 app.innerHTML=h;calc()}
const ct=c=>(c||[]).map(x=>(x.n>1?x.n+' × ':'')+fmt(x.l)+' cm'+(x.t=='sobrante'?' (sobrante)':'')).join(' · ');
function row(l,v,c){return `<div class="r"><span>${l}</span><b class="v ${c||''}">${v}</b></div>`}
function calc(){
 const s=S[cur];if(s.txt)return;let tot=0;
 s.rows.forEach((r,i)=>{const v=r[2]*num(s.q[i]);tot+=v;document.getElementById('i'+i).textContent=eur(v)});
 document.getElementById('t0').textContent=eur(tot);document.getElementById('t1').textContent='TOTAL +'+Math.round(s.rec*100)+'%: '+eur(tot*(1+s.rec));
 const res=document.getElementById('res');if(!res)return;
 const p={};for(const k in s.p)p[k]=k=='opt'?s.p[k]:num(s.p[k]);let h='',f=x=>x==null?'—':x;
 if(s.tec){const d=tec(p,s.k);
  h+=row('Peldaños por baldosa',d.spo)+row('Piezas por baldosa (huella + contrahuella)',d.pcs)+row('Cortes por baldosa',d.c)+row('Metros de corte por baldosa',d.m.toFixed(2))+row('Colocación',d.col);
  if(d.opt){const o=d.opt,b=o.bb;h+=`<div class="sec">Optimización de piezas</div>`+row('¿Se aplica?',o.ap?'Sí':'No: ya es lo mejor',o.ap?'good':'bad');
   if(o.ap)h+=row('Colocación',o.ori)+row('Baldosas completas',b.F)+row('Filas de huella y de contrahuella por baldosa',b.a+' y '+b.b)+row('Baldosa de resto (filas huella + contra)',b.Rm>0?b.ar+' + '+b.br:'No hay')+row('Baldosas solo con contrahuellas',b.ex)}
  h+=`<div class="sec">Baldosas necesarias</div>`+row('Baldosas necesarias',d.t==null?(p.N>0?'No cabe':'—'):d.t,'good')+row('Peldaños que sobran',f(d.sob))+row('Metros de corte totales',d.mt==null?'—':d.mt.toFixed(2))+row('Metros lineales de peldaños',d.mp.toFixed(2));
  h+=`<div class="sec">Diseño de cortes</div>`+seg()+planTec(d,p,s.k)+(d.opt&&d.opt.ap?'':`<p class="note">Baldosa completa. Cortes en orden: ${ct(d.cuts)}</p>`)+((d.pr&&!(d.opt&&d.opt.ap))?`<p class="note"><b>Última baldosa</b>: ${d.pr.r} ${d.pr.r>1?'peldaños':'peldaño'}, ${d.pr.c} cortes, ${d.pr.m.toFixed(2)} m</p>`+planTec(d,p,s.k,d.pr.gx,d.pr.gy)+`<p class="note">Cortes en orden: ${ct(d.pr.cuts)}</p>`:'')+`<p class="note">${d.opt&&d.opt.ap?'Plano de una baldosa completa con la optimización.':'Plano de una baldosa.'} Azul: huella (${fmt(p.sl)} × ${fmt(p.hf)} cm)${p.ch>0?` · naranja: contrahuella (${fmt(p.sl)} × ${fmt(p.ch)} cm)`:''}. El hueco entre piezas es el disco.</p>`;
  h+=`<p class="note">Huella y contrahuella salen de la misma baldosa; el corte que las separa va incluido en el peldaño.</p>`}
 else{const d=gen(p,s.k);
  h+=row('Piezas por baldosa',d.pcs)+row('Cortes por baldosa',d.c)+row('Metros de corte por baldosa',d.m.toFixed(2))+row('Colocación',d.col)+`<div class="sec">Baldosas necesarias</div>`+row('Baldosas necesarias',d.t==null?(p.N>0?'No cabe':'—'):d.t,'good')+row('Piezas que sobran',f(d.sob))+row('Metros de corte totales',d.mt==null?'—':d.mt.toFixed(2))+`<div class="sec">Diseño de cortes</div>`+seg()+`<p class="note"><b>Baldosa completa</b>: ${d.pcs} piezas, ${d.c} cortes, ${d.m.toFixed(2)} m</p>`+planGen(d,p,s.k)+`<p class="note">Cortes en orden: ${ct(d.o.cuts)}</p>`+(d.pr?`<p class="note"><b>Última baldosa</b>: ${d.pr.r} ${d.pr.r>1?'piezas':'pieza'}, ${d.pr.c} cortes, ${d.pr.m.toFixed(2)} m</p>`+planGen(d,p,s.k,d.pr.gx,d.pr.gy,d.pr.r)+`<p class="note">Cortes en orden: ${ct(d.pr.cuts)}</p>`:'')+`<p class="note">Baldosa de ${fmt(p.BL)} × ${fmt(p.BW)} cm. Cada rectángulo es una pieza de ${fmt(d.o.l)} × ${fmt(d.o.w)} cm y el hueco entre ellas es el disco. Se elige la orientación y el orden de corte que dan más piezas y menos corte.</p>`}
 res.innerHTML=h}
app.addEventListener('input',e=>{const t=e.target,s=S[cur];
 if(t.dataset.q!==undefined)s.q[t.dataset.q]=t.value;else if(t.dataset.k)s.p[t.dataset.k]=t.value;else if('kerf' in t.dataset)s.k=num(t.value);else if('rec' in t.dataset)s.rec=num(t.value)/100;else if('opt' in t.dataset)s.p.opt=t.value;calc()});
app.addEventListener('click',e=>{const v=e.target.dataset&&e.target.dataset.v;if(v){V3=v=='3';calc()}});
draw();
</script></body></html>
